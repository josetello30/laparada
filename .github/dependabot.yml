# Monitoreo continuo de dependencias vulnerables (Operate/Monitor)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # evita paquetes recién publicados (posible malware)
    target-branch: test
    open-pull-requests-limit: 5
    labels: [dependencias, seguridad]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # evita paquetes recién publicados (posible malware)
    target-branch: test
