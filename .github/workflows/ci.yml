# Pipeline CI/CD DevSecOps · La Parada Digital
# Se ejecuta en cada push y Pull Request hacia `test` (pruebas) y `main` (producción).
# Etapas: calidad → pruebas (unitarias + integración) → seguridad (SAST, dependencias, secretos) → build.
# El despliegue lo hace la integración Git de Vercel y se verifica en deploy.yml (smoke tests).
name: CI-CD DevSecOps

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  calidad:
    name: 1 · Build check - Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (reglas Next.js + TypeScript)
        run: pnpm lint
      - name: Verificación de tipos (tsc)
        run: pnpm typecheck

  pruebas:
    name: 2 · Test - Unitarias e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Pruebas unitarias con cobertura (Vitest)
        run: pnpm test:coverage
      - name: Pruebas de integración contra Supabase (Auth + RLS + triggers)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: pnpm vitest run tests/integracion --outputFile.junit=reports/junit-integracion.xml
      - name: Resumen de resultados
        if: always()
        run: |
          echo "## Resultados de pruebas" >> $GITHUB_STEP_SUMMARY
          for f in reports/junit*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            sk=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            echo "- **$(basename $f)**: $t pruebas · $fl fallidas · ${sk:-0} omitidas" >> $GITHUB_STEP_SUMMARY
          done
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total;console.log('- **Cobertura** (reglas y validaciones): líneas '+c.lines.pct+'% · ramas '+c.branches.pct+'% · funciones '+c.functions.pct+'%')" >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas
          path: |
            reports/
            coverage/coverage-summary.json

  sast:
    name: 3a · Seguridad - SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Análisis estático de seguridad (OWASP Top 10, React, Next.js, TypeScript)
        run: |
          semgrep scan --config p/owasp-top-ten --config p/typescript --config p/react --config p/nextjs \
            --config p/secrets --exclude node_modules --exclude reports --error --metrics=off \
            --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep-sarif, path: semgrep.sarif }

  dependencias:
    name: 3b · Seguridad - Dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - name: Auditoría de dependencias de producción (bloquea severidad alta o crítica)
        run: pnpm audit --prod --audit-level=high
      - name: Reporte completo (informativo, incluye dependencias de desarrollo)
        if: always()
        run: pnpm audit || true

  secretos:
    name: 3c · Seguridad - Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks sobre todo el historial de commits
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  build:
    name: 4 · Build de producción
    runs-on: ubuntu-latest
    needs: [calidad, pruebas, sast, dependencias, secretos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm build
      - name: Listo para desplegar
        run: |
          echo "## Build OK" >> $GITHUB_STEP_SUMMARY
          echo "Rama: \`${GITHUB_REF_NAME}\` · Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "Vercel despliega esta versión a producción." >> $GITHUB_STEP_SUMMARY; fi
